<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#C9962B"/>
    </marker>
  </defs>
  <rect width="1200" height="560" rx="24" fill="#1E1612"/>

  <!-- device boundary -->
  <rect x="250" y="40" width="910" height="250" rx="22" fill="#12271a" stroke="#2E7D32" stroke-width="3" stroke-dasharray="10 7"/>
  <text x="275" y="76" font-size="20" font-weight="700" fill="#8fd694">🔒 STAYS ON YOUR DEVICE · nothing recorded · forgotten in 30 s</text>

  <g font-size="20" fill="#FFF8F0" text-anchor="middle">
    <!-- 1 call -->
    <rect x="40" y="120" width="170" height="130" rx="18" fill="#4A3B32"/>
    <text x="125" y="170" font-size="34">📞</text>
    <text x="125" y="205" font-weight="700">Call on</text>
    <text x="125" y="230" font-weight="700">speaker</text>

    <!-- 2 mic -->
    <rect x="280" y="120" width="190" height="130" rx="18" fill="#3a2d25" stroke="#C9962B"/>
    <text x="375" y="170" font-size="34">🎙️</text>
    <text x="375" y="205" font-weight="700">Browser mic</text>
    <text x="375" y="230" font-size="16" fill="#d9c7b5">live audio, in memory</text>

    <!-- 3 whisper -->
    <rect x="530" y="120" width="230" height="130" rx="18" fill="#3a2d25" stroke="#C9962B"/>
    <text x="645" y="170" font-size="34">🧠</text>
    <text x="645" y="205" font-weight="700">Whisper on this laptop</text>
    <text x="645" y="230" font-size="15" fill="#d9c7b5">speech → text, ~0.7 s / sentence</text>

    <!-- 4 detector -->
    <rect x="820" y="120" width="310" height="130" rx="18" fill="#3a2d25" stroke="#C9962B"/>
    <text x="975" y="170" font-size="34">🔎</text>
    <text x="975" y="205" font-weight="700">Detector: 5-step scam script</text>
    <text x="975" y="230" font-size="14" fill="#d9c7b5">Authority · Fear · Isolation · Control · Transfer</text>
  </g>

  <g stroke="#C9962B" stroke-width="4" fill="none" marker-end="url(#ar)">
    <line x1="212" y1="185" x2="276" y2="185"/>
    <line x1="472" y1="185" x2="526" y2="185"/>
    <line x1="762" y1="185" x2="816" y2="185"/>
    <path d="M975 252 V320"/>
  </g>

  <!-- decision -->
  <g text-anchor="middle">
    <rect x="845" y="328" width="260" height="62" rx="31" fill="#C9962B"/>
    <text x="975" y="367" font-size="22" font-weight="700" fill="#1E1612">Risk 70 / 100 or more?</text>
  </g>

  <g stroke="#C9962B" stroke-width="4" fill="none" marker-end="url(#ar)">
    <path d="M843 359 H700"/>
    <path d="M975 392 V440"/>
  </g>
  <text x="772" y="347" font-size="18" fill="#d9c7b5" text-anchor="middle">no</text>
  <text x="995" y="424" font-size="18" fill="#d9c7b5">yes</text>

  <g font-size="20" text-anchor="middle">
    <!-- safe -->
    <rect x="420" y="320" width="276" height="78" rx="18" fill="#163821" stroke="#2E7D32"/>
    <text x="558" y="353" fill="#8fd694" font-weight="700">🟢 Safe   🟡 Be careful</text>
    <text x="558" y="381" font-size="16" fill="#c7dcc7">keeps listening quietly</text>

    <!-- alarm -->
    <rect x="820" y="444" width="310" height="86" rx="18" fill="#8B2E16"/>
    <text x="975" y="480" fill="#fff" font-weight="700">🔴 Full-screen warning</text>
    <text x="975" y="508" font-size="16" fill="#f6d9cf">spoken in Hindi, English or Punjabi</text>

    <!-- family -->
    <rect x="420" y="444" width="330" height="86" rx="18" fill="#3a2d25" stroke="#2E7D32" stroke-width="2"/>
    <text x="585" y="480" fill="#FFF8F0" font-weight="700">📱 Family alert</text>
    <text x="585" y="508" font-size="16" fill="#8fd694">risk and steps only, never the words</text>
  </g>
  <g stroke="#C9962B" stroke-width="4" fill="none" marker-end="url(#ar)">
    <path d="M818 487 H754"/>
  </g>

  <text x="40" y="350" font-size="17" fill="#d9c7b5">Before any money</text>
  <text x="40" y="374" font-size="17" fill="#d9c7b5">is asked for, the</text>
  <text x="40" y="398" font-size="17" fill="#d9c7b5">user is warned and</text>
  <text x="40" y="422" font-size="17" fill="#d9c7b5">told what to do next</text>
  <text x="40" y="446" font-size="17" fill="#d9c7b5">(hang up, call 1930).</text>
</svg>
